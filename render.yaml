# Render Blueprint — GitHub 저장소 루트
# 권장: rootDir = order-app/server / build = npm install / start = node index.js
# 또는 루트 비움 / build = npm install / start = npm start (루트 index.js 사용)
services:
  - type: web
    name: order-app-api
    runtime: node
    rootDir: order-app/server
    buildCommand: npm install
    startCommand: node index.js
    # 루트 배포 시: rootDir 비우고 startCommand = npm start
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
